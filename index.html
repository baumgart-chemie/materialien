<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemie · Simulationen und Übungen</title>
<style>
:root{
  --bg:#14171a; --panel:#1b1f23; --panel-alt:#20252a; --raise:#262c32;
  --line:#31383e; --line-soft:#262c31;
  --text:#e7e4dd; --text-dim:#9aa2a9; --text-faint:#5f6870;
  --amber:#ffb454; --amber-dim:#8a6535;
  --teal:#4fd1c5; --teal-dim:#2c5b56;
  --radius:3px;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;}
h1,h2,h3{font-weight:600; margin:0;}

/* header – wie Simulation „Gaschromatograph“ */
header{
  padding:22px 28px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
}
header h1{font-size:20px; letter-spacing:.2px;}
header .tag{color:var(--text-dim); font-size:13.5px;}

/* QR-Code zur Startseite */
.qr-btn{
  margin-left:auto; align-self:center; display:flex; align-items:center; gap:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:5px 12px 5px 5px;
  color:var(--text-dim); font:inherit; font-size:12.5px; line-height:1.3; text-align:left; cursor:pointer;
}
.qr-btn:hover{border-color:var(--teal); color:var(--text);}
.qr-btn:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
.qr-btn .qr-svg{width:66px; height:66px; display:block; border-radius:2px;}
.qr-btn b{display:block; color:var(--text); font-weight:600;}
.qr-modal{display:none; position:fixed; inset:0; z-index:100; background:rgba(8,10,12,.82); align-items:center; justify-content:center; padding:20px;}
.qr-modal.open{display:flex;}
.qr-box{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:22px 24px 20px; text-align:center; max-width:94vw;}
.qr-box .qr-svg{width:min(62vh,80vw,520px); height:auto; display:block; margin:0 auto; border-radius:4px;}
.qr-box .qr-url{font-family:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace; font-size:clamp(16px,2.6vw,26px); color:var(--text); margin:16px 0 4px; word-break:break-all;}
.qr-box .qr-hint{font-size:13px; color:var(--text-dim); margin:0 0 14px;}
.qr-close{background:var(--panel-alt); border:1px solid var(--line); color:var(--text); border-radius:var(--radius); padding:8px 18px; font:inherit; font-size:13px; cursor:pointer;}
.qr-close:hover{border-color:var(--text-faint);}
@media (max-width:600px){ .qr-btn span{display:none;} .qr-btn{padding:4px;} }

/* Rubrik-Navigation als Tabs */
nav{
  position:sticky; top:0; z-index:10; background:var(--bg);
  display:flex; gap:2px; flex-wrap:wrap; padding:0 28px;
  border-bottom:1px solid var(--line);
}
nav a{
  color:var(--text-dim); font-size:13px; padding:10px 4px; margin-right:22px;
  text-decoration:none; border-bottom:2px solid transparent; font-weight:500;
}
nav a:hover{color:var(--text);}
nav a.active{color:var(--text); border-bottom-color:var(--amber);}

main{max-width:1100px; padding:24px 28px 60px;}

section.block{margin-bottom:30px; scroll-margin-top:56px;}
.block h2{
  font-size:12.5px; color:var(--text-dim); font-weight:600; letter-spacing:.2px;
  padding-bottom:8px; border-bottom:1px solid var(--line-soft); margin-bottom:14px;
  display:flex; align-items:center; gap:10px;
}
.block h2 .kurz{
  font-family:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace; font-size:11.5px; color:var(--amber);
  border:1px solid var(--amber-dim); border-radius:var(--radius); padding:1px 7px;
}

.grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
.tile{
  display:block; text-decoration:none; color:inherit;
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
  padding:14px 16px; transition:border-color .15s, background .15s;
}
.tile:hover{border-color:var(--teal); background:var(--panel-alt);}
.tile h3{font-size:14.5px; color:var(--text); margin-bottom:4px; display:flex; align-items:center; gap:8px;}
.tile h3 .nr{
  font-family:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace; font-size:11.5px; font-weight:600; color:var(--teal);
  border:1px solid var(--teal-dim); border-radius:var(--radius); min-width:22px; padding:1px 5px;
  text-align:center; flex:none;
}
.tile p{margin:0; font-size:13px; color:var(--text-dim); line-height:1.55;}
.tile .open{display:inline-block; margin-top:10px; font-size:12.5px; color:var(--teal); border-bottom:1px solid var(--teal-dim);}
.tile:hover .open{border-bottom-color:var(--teal);}

.empty{
  color:var(--text-faint); font-size:13px; padding:14px 16px;
  border:1px dashed var(--line); border-radius:4px; background:transparent;
}

footer{padding:16px 28px 30px; color:var(--text-faint); font-size:11.5px; border-top:1px solid var(--line-soft);}
footer a{color:var(--text-dim); text-decoration:none; border-bottom:1px solid var(--line);}
footer a:hover{color:var(--text); border-bottom-color:var(--text-dim);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
@media (max-width:600px){
  header, main, footer{padding-left:16px; padding-right:16px;}
  nav{padding:0 16px;}
  nav a{margin-right:14px;}
}
.tile p.meta{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:baseline; font-size:12px;}
.tile .ver{font-family:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace; font-size:11px; color:var(--amber); border:1px solid var(--amber-dim); border-radius:var(--radius); padding:0 6px;}
.tile .neu{color:var(--teal);}
</style>
</head>

/* ---------- Ab hier nichts ändern ---------- */
const nav = document.getElementById("nav");
const main = document.getElementById("inhalt");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

rubriken.forEach(r => {
  nav.insertAdjacentHTML("beforeend", `<a href="#${r.id}" data-id="${r.id}">${esc(r.titel)}</a>`);
  const inhalt = r.eintraege.length
    ? `<div class="grid">${r.eintraege.map((e, i) => `
        <a class="tile" href="${esc(e.link)}">
          <h3><span class="nr">${i + 1}</span>${esc(e.titel)}</h3>
          <p>${esc(e.beschreibung || "")}</p>
          ${e.version || e.neu ? `<p class="meta">${e.version ? `<span class="ver">V${esc(e.version)}</span>` : ""}${e.neu ? `<span class="neu">Neu: ${esc(e.neu)}</span>` : ""}</p>` : ""}
          <span class="open">Öffnen →</span>
        </a>`).join("")}</div>`
    : `<div class="empty">Inhalte folgen.</div>`;
  main.insertAdjacentHTML("beforeend", `
    <section class="block" id="${r.id}">
      <h2><span class="kurz">${r.kurz}</span>${esc(r.titel)}</h2>
      ${inhalt}
    </section>`);
});

/* QR-Code vergrößern */
const qrModal = document.getElementById("qrModal");
const qrOpen = () => { qrModal.classList.add("open"); document.getElementById("qrClose").focus(); };
const qrShut = () => { qrModal.classList.remove("open"); document.getElementById("qrBtn").focus(); };
document.getElementById("qrBtn").addEventListener("click", qrOpen);
document.getElementById("qrClose").addEventListener("click", qrShut);
qrModal.addEventListener("click", e => { if (e.target === qrModal) qrShut(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && qrModal.classList.contains("open")) qrShut(); });

/* aktive Rubrik in der Navigation markieren */
const links = [...nav.querySelectorAll("a")];
const obs = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) links.forEach(a => a.classList.toggle("active", a.dataset.id === en.target.id));
  });
}, { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("section.block").forEach(s => obs.observe(s));
</script>
